name: Publish Wood

on:
  push:
    branches:
      - master

jobs:
  publish-wood-docker-image:
    name: Publish Wood Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Wood
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Wood
        run: npm test

      - name: Build the Wood Docker image
        run: docker build -t ghcr.io/jbatch/wood:latest .

      - name: Push the Wood Docker image
        run: docker push ghcr.io/jbatch/wood:latest
